name: Daily Digest

on:
  schedule:
    # 每天 1:30 UTC = 北京 09:30（工作日判断在脚本内）
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser huggingface_hub

      - name: 抓取全部信源（RSS + HF Papers + GitHub Trending + 翻译）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 fetch_newsletters.py

      - name: 重建 news 站（常规新闻 + 定制新闻）
        run: |
          python3 build_news.py zh
          python3 build_news.py en

      - name: Commit + push (触发 Vercel 重发)
        run: |
          git config user.name "aipulse-bot"
          git config user.email "aipulse-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化, 跳过 commit"
          else
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            git push
          fi
